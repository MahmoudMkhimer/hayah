  'money-goto':el=>{ filters.month=el.dataset.m; filters.txAll=false; filters.moneyView='month'; if(sheetOpen) closeSheet(); render(); window.scrollTo(0,0); },
  'tx-more':()=>{ filters.txAll=!filters.txAll; render(); },
  'add-income':()=>incomeSheet(null),
  'add-expense':el=>{ expenseSheet(null,{bucket:el.dataset.bucket||null}); if(el.dataset.return&&draft) draft.returnBucket=el.dataset.bucket; },
  'add-transfer':el=>transferSheet(null,{from:el.dataset.from||null,to:el.dataset.to||null}),
  'edit-tx':el=>{ const k=el.dataset.kind, id=el.dataset.id; if(k==='income'){ const x=F().incomes.find(y=>y.id===id); if(x) incomeSheet(x); } else if(k==='expense'){ const x=F().expenses.find(y=>y.id===id); if(x) expenseSheet(x); } else { const x=F().transfers.find(y=>y.id===id); if(x) transferSheet(x); } },
  'delete-tx':el=>{ const k=el.dataset.kind, id=el.dataset.id; const lbl={income:'تم حذف الدخل',expense:'تم حذف المصروف',transfer:'تم حذف التحويل'}[k]; commit(lbl,()=>{ const f=F(); if(k==='income') f.incomes=f.incomes.filter(x=>x.id!==id); else if(k==='expense') f.expenses=f.expenses.filter(x=>x.id!==id); else f.transfers=f.transfers.filter(x=>x.id!==id); },{ms:8000}); closeSheet(); },
  'open-bucket':el=>bucketDetail(el.dataset.id),
  'split-mode':el=>{ if(!draft) return; draft.mode=el.dataset.v; $$('#f-split-mode button').forEach(b=>b.classList.toggle('on',b.dataset.v===draft.mode)); refreshSplit(); },
  'pick-one':el=>{ if(!draft) return; draft.one=el.dataset.id; refreshSplit(); },
  'pick-bucket':el=>{ if(!draft) return; draft.bucketId=el.dataset.id; $('#f-bucket').innerHTML=bucketChips(draft.bucketId,'pick-bucket'); const b=bucketById(draft.bucketId); const h=$('#f-bucket-hint'); if(h) h.hidden=!(b&&b.kind==='invest'); },
  'pick-cat':el=>{ if(!draft) return; draft.category=el.dataset.v; $$('#f-cat button').forEach(b=>b.classList.toggle('on',b.dataset.v===draft.category)); },
  'pick-from':el=>{ if(!draft) return; draft.from=el.dataset.id; if(draft.to===draft.from){ const alt=sortedBuckets().find(b=>b.id!==draft.from); draft.to=alt?alt.id:draft.to; } $('#f-from').innerHTML=bucketChips(draft.from,'pick-from',null); $('#f-to').innerHTML=bucketChips(draft.to,'pick-to',draft.from); const b=bucketById(draft.from); const h=$('#f-tr-hint'); if(h) h.hidden=!(b&&b.kind==='invest'); },
  'pick-to':el=>{ if(!draft) return; draft.to=el.dataset.id; $('#f-to').innerHTML=bucketChips(draft.to,'pick-to',draft.from); },
  'repair-months':el=>{ if(!draft) return; draft.repairMonths=+el.dataset.v; $$('#f-repair-m button').forEach(b=>b.classList.toggle('on',+b.dataset.v===draft.repairMonths)); const b=bucketById(draft.id); const p=$('#repair-preview'); if(b&&p){ const s=bucketState(b,filters.month||curMonth()); p.textContent=repairPreview(planAmount(s),draft.repairMonths); } },
  'repair-start':el=>{ if(!draft) return; draft.repairStart=el.dataset.v; $$('#f-repair-s button').forEach(b=>b.classList.toggle('on',b.dataset.v===draft.repairStart)); },
  'repair-set':el=>{ const b=bucketById(el.dataset.id); if(!b||!draft) return; const s=bucketState(b,filters.month||curMonth()); const amount=planAmount(s); if(!(amount>0)) return; const months=draft.repairMonths||2, startMonth=draft.repairStart==='next'?addMonths(curMonth(),1):curMonth(); commit('تم اعتماد خطة التعويض على '+nOf(months,'شهر واحد','شهرين','شهور','شهر'),()=>{ F().repairs=F().repairs.filter(r=>r.bucketId!==b.id); F().repairs.push({id:uid(),bucketId:b.id,amount,months,startMonth}); }); bucketDetail(b.id); },
  'repair-cancel':el=>{ const id=el.dataset.id; const r=F().repairs.find(x=>x.id===id); if(!r) return; const bid=r.bucketId; commit('تم إلغاء خطة التعويض',()=>{ F().repairs=F().repairs.filter(x=>x.id!==id); }); bucketDetail(bid); },
  'fin-settings':()=>finSettingsSheet(),
  'fs-add':()=>{ if(!draft) return; const n=draft.buckets.length; draft.buckets.push({id:uid(),name:'',pct:0,color:COLORS[n%COLORS.length],kind:'custom',order:n,note:''}); refreshFs(); const inputs=$$('#fs-buckets [data-input="fs-name"]'); const last=inputs[inputs.length-1]; if(last) last.focus(); },
  'fs-del':el=>{ if(!draft) return; draft.buckets.splice(+el.dataset.i,1); refreshFs(); },
  'fs-color':el=>{ if(!draft) return; const b=draft.buckets[+el.dataset.i]; if(!b) return; const k=COLORS.indexOf(b.color); b.color=COLORS[(k+1)%COLORS.length]; refreshFs(); },
  'fs-preset':el=>{ if(!draft) return; const p=el.dataset.p==='ferry'?{obligations:34,invest:33,personal:33}:{obligations:50,personal:30,invest:20}; const have=k=>draft.buckets.find(b=>b.kind===k); const defs=defaultBuckets(); Object.keys(p).forEach(k=>{ let b=have(k); if(!b){ b=defs.find(x=>x.kind===k); b.id=uid(); b.order=draft.buckets.length; draft.buckets.push(b); } b.pct=p[k]; }); draft.buckets.forEach(b=>{ if(!p[b.kind]) b.pct=0; }); refreshFs(); },
  'fs-cat-add':()=>{ if(!draft) return; const i=$('#fs-cat-new'); const v=(i.value||'').trim().slice(0,20); if(!v) return; if(!draft.categories.includes(v)) draft.categories.push(v); i.value=''; refreshFs(); i.focus(); },
  'fs-cat-del':el=>{ if(!draft) return; draft.categories.splice(+el.dataset.i,1); refreshFs(); },
  /* --- التطوّر --- */
  'add-session':el=>sessionSheet(null,{kind:el.dataset.kind||'cardio',skill:el.dataset.skill||'',returnSkill:el.dataset.return?el.dataset.skill:null}),
  'edit-session':el=>{ const x=B().sessions.find(y=>y.id===el.dataset.id); if(x) sessionSheet(x); },
  'delete-session':el=>{ const id=el.dataset.id; commit('تم حذف الجلسة',()=>{ B().sessions=B().sessions.filter(x=>x.id!==id); },{ms:8000}); closeSheet(); },
  'pick-kind':el=>{ if(!draft) return; draft.skind=el.dataset.v; $$('#f-kind button').forEach(b=>b.classList.toggle('on',b.dataset.v===draft.skind)); const hr=$('#f-hr-wrap'); if(hr) hr.hidden=!HEART_K.includes(draft.skind); const il=$('#f-int-lbl'); if(il) il.textContent=MIND_K.includes(draft.skind)?'مستوى التركيز':'الشدة'; },
  'pick-min':el=>{ const i=$('#f-min'); if(i) i.value=el.dataset.v; $$('#f-min-quick button').forEach(b=>b.classList.toggle('on',b.dataset.v===el.dataset.v)); },
  'pick-int':el=>{ if(!draft) return; draft.intensity=+el.dataset.v; $$('#f-int button').forEach(b=>b.classList.toggle('on',+b.dataset.v===draft.intensity)); },
  'add-metric':()=>metricSheet(null),
  'edit-metric':el=>{ const m=B().metrics.find(y=>y.id===el.dataset.id); if(m) metricSheet(m); },
  'delete-metric':el=>{ const id=el.dataset.id; commit('تم حذف القياس',()=>{ B().metrics=B().metrics.filter(x=>x.id!==id); },{ms:8000}); closeSheet(); },
  'add-skill':()=>skillSheet(null),
  'edit-skill':el=>{ const s=skillById(el.dataset.id); if(s) skillSheet(s); },
  'open-skill':el=>skillDetail(el.dataset.id),
  'archive-skill':el=>{ const s=skillById(el.dataset.id); if(!s) return; const was=s.archived; commit(was?'تمت إعادة تفعيل المهارة':'تمت أرشفة المهارة',()=>{ s.archived=!was; }); closeSheet(); },
  'delete-skill':el=>{ const id=el.dataset.id; const n=B().sessions.filter(x=>x.skillId===id).length; commit(n?'تم حذف المهارة — '+n+' جلسة بقيت في السجل بدون مهارة':'تم حذف المهارة',()=>{ B().skills=B().skills.filter(x=>x.id!==id); B().sessions.forEach(x=>{ if(x.skillId===id) x.skillId=null; }); },{ms:9000}); closeSheet(); },
  'timer-open':()=>timerOpenSheet(),
  'timer-start':el=>{ if(el.dataset.fromSheet){ const sel=$('#f-skill'); timerStart((draft&&draft.skind)||'study',sel?(sel.value||null):null); } else timerStart(el.dataset.kind||'practice',el.dataset.skill||null); },
  'timer-stop':()=>timerStop(),
  'timer-cancel':()=>timerCancel(),
  'sess-more':()=>{ filters.sessAll=!filters.sessAll; render(); },
  'set-skin':el=>{ state.settings.skin=el.dataset.v; save(); applyTheme(); render(); openSettings(); },
  'open-level':()=>characterSheet(),
  'avatar-pick':()=>{ const i=$('#avatar-file'); i.value=''; i.click(); },
  'avatar-remove':()=>{ state.settings.avatar=null; save(); render(); characterSheet(); toast('تمت إزالة الصورة'); },
  'pick-cur':el=>pickCur(el.dataset.l),
  'fs-cur-add':el=>{ if(!draft) return; let l=el.dataset.l||''; if(!l){ const i=$('#fs-cur-new'); l=(i.value||'').trim().slice(0,8); if(i) i.value=''; } if(!l) return; if(l===($('#f-cur')||{}).value) { toast('هذه هي العملة الأساسية بالفعل'); return; } if(!draft.currencies.some(c=>c.label===l)) draft.currencies.push({label:l,rate:''}); refreshFs(); const inputs=$$('#fs-curs [data-input="fs-cur-rate"]'); const last=inputs[inputs.length-1]; if(last&&!last.value) last.focus(); },
  'fs-cur-del':el=>{ if(!draft) return; draft.currencies.splice(+el.dataset.i,1); refreshFs(); }
};
const SUBMIT={
  'save-task':f=>saveTask(f), 'save-habit':f=>saveHabit(f), 'save-goal':f=>saveGoal(f),
  'save-income':f=>saveIncome(f), 'save-expense':f=>saveExpense(f), 'save-transfer':f=>saveTransfer(f), 'save-fin-settings':f=>saveFinSettings(f),
  'save-session':f=>saveSession(f), 'save-metric':f=>saveMetric(f), 'save-skill':f=>saveSkill(f),
  'save-read':f=>saveRead(f), 'save-surah':f=>saveSurah(f), 'save-deen-settings':f=>saveDeenSettings(f),
  'save-debt':f=>saveDebt(f), 'save-payment':f=>savePayment(f),
  'save-journal':f=>saveJournal(f), 'save-ai':f=>saveAI(f),
  'save-food':f=>saveFood(f), 'save-quick':f=>saveQuick(f), 'save-targets2':f=>saveTargets2(f),
  'save-sets':f=>saveSets(f), 'save-exercise':f=>saveExercise(f), 'save-extra':f=>saveExtra(f), 'save-targets':f=>saveTargets(f), 'save-fit-settings':f=>saveFitSettings(f),
  'ms-add':f=>{ const g=goalById(f.dataset.gid); const v=(f.title.value||'').trim(); if(!g||!v) return; commit(null,()=>{ g.milestones.push({id:uid(),title:v,done:false}); }); goalDetail(g.id); setTimeout(()=>{ const i=$('#sheet-root input[name=title]'); if(i) i.focus(); },50); },
  'welcome-start':f=>{ const name=($('#w-name').value||'').trim(); const seed=$('#w-seed').checked; state.settings.name=name; state.settings.seeded=true; if(seed) seedSamples(); save(); render(); toast(seed?'أضفنا أمثلة — امسحها من الإعدادات وقت ما تحب':'يلا نبدأ — أضف هدفك الأول'); }
};
document.addEventListener('click',e=>{ if(e.target.closest('a[data-stop]')) return; const el=e.target.closest('[data-action]'); if(!el) return; const h=A[el.dataset.action]; if(!h) return; e.preventDefault(); try{ h(el,e); }catch(err){ reportError(err); } });
document.addEventListener('submit',e=>{ const f=e.target.closest('form[data-submit]'); if(!f) return; e.preventDefault(); const h=SUBMIT[f.dataset.submit]; if(!h) return; try{ h(f); }catch(err){ reportError(err); } });
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){ const rb=e.target.closest('[role="button"][data-action]'); if(rb){ e.preventDefault(); rb.click(); return; } }
  if(e.key!=='Enter') return; const el=e.target.closest('[data-enter]'); if(!el) return; e.preventDefault(); const h=A[el.dataset.enter]; if(h) try{ h(el,e); }catch(err){ reportError(err); } });
let qTimer=null;
document.addEventListener('input',e=>{ const el=e.target; const k=el.dataset.input; if(!k) return; try{
  if(k==='task-q'){ filters.q=el.value; clearTimeout(qTimer); qTimer=setTimeout(()=>{ render(); const i=$('#task-q'); if(i){ i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(_){} } },120); }
  else if(k==='cur-rate'){ if(draft){ const v=parseAmount(el.value); draft.rate=isFinite(v)&&v>0?v:0; updateCurPreview(); if(draft.kind==='income'){ draft.amount=currentAmount(); refreshSplit(); } } }
  else if(k==='fs-cur-label'){ if(draft&&draft.currencies[+el.dataset.i]) draft.currencies[+el.dataset.i].label=el.value; }
  else if(k==='fs-cur-rate'){ if(draft&&draft.currencies[+el.dataset.i]){ const v=parseAmount(el.value); draft.currencies[+el.dataset.i].rate=isFinite(v)&&v>0?v:''; } }
  else if(k==='amt'){ updateCurPreview(); if(draft&&draft.kind==='income'){ draft.amount=currentAmount(); if(draft.mode!=='manual') refreshSplit(); else { const s=$('#split-sum'); if(s){ const bs=sortedBuckets(); const sum=round2(bs.reduce((a,b)=>a+(+draft.split[b.id]||0),0)); const a=draft.amount; const bad=Math.abs(sum-a)>0.01; s.className='split-sum'+(bad?' bad':''); s.innerHTML='<span>مجموع التقسيم</span><span>'+fmtNum(sum)+' من '+fmtNum(a)+(bad?' — الفرق '+fmtNum(round2(a-sum)):'')+'</span>'; } } } }
  else if(k==='split'){ if(draft&&draft.kind==='income'){ const v=parseAmount(el.value); draft.split[el.dataset.bid]=isFinite(v)&&v>=0?v:0; const bs=sortedBuckets(); const sum=round2(bs.reduce((a,b)=>a+(+draft.split[b.id]||0),0)); const a=currentAmount(); const bad=Math.abs(sum-a)>0.01; const s=$('#split-sum'); if(s){ s.className='split-sum'+(bad?' bad':''); s.innerHTML='<span>مجموع التقسيم</span><span>'+fmtNum(sum)+' من '+fmtNum(a)+(bad?' — الفرق '+fmtNum(round2(a-sum)):'')+'</span>'; } } }
  else if(k==='money-q'){ filters.moneyQ=el.value; clearTimeout(qTimer); qTimer=setTimeout(()=>{ render(); const i=$('#money-q'); if(i){ i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(_){} } },200); }
  else if(k==='food-q'){ if(draft&&draft.kind==='logfood'){ draft.q=el.value; clearTimeout(qTimer); qTimer=setTimeout(()=>{ renderLogFood(); const i=$('#food-q'); if(i){ i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(_){} } },180); } }
  else if(k==='qty'){ if(draft&&draft.kind==='qty'){ const v=parseAmount(el.value); draft.qty=(isFinite(v)&&v>0)?v:0; const f=foodById(draft.foodId); if(f){ const c=computeFood(f,draft.qty); const box=$('.macro-prev'); if(box) box.innerHTML=MACROS.map(m=>'<div><b class="num" style="color:'+m[2]+'">'+(m[0]==='kcal'?c.kcal:fmtNum(c[m[0]]))+'</b><small>'+m[1]+(m[0]==='kcal'?'':' جم')+'</small></div>').join(''); $$('#f-qq button').forEach(b=>b.classList.toggle('on',+b.dataset.v===draft.qty)); } } }
  else if(k==='plan-name'){ if(draft&&draft.kind==='plan') draft.plan.workout.name=el.value.slice(0,60); }
  else if(k==='pi-sets'||k==='pi-reps'||k==='pi-w'){ if(draft&&draft.kind==='plan'){ const it=draft.plan.workout.items[+el.dataset.i]; if(it){ const v=parseAmount(el.value); if(k==='pi-sets') it.sets=(v>0)?Math.min(20,Math.round(v)):it.sets; else if(k==='pi-reps') it.reps=(v>0)?Math.min(200,Math.round(v)):it.reps; else it.weight=(v>=0)?round2(v):it.weight; } } }
  else if(k==='pm-title'||k==='pm-items'||k==='pm-kcal'||k==='pm-prot'){ if(draft&&draft.kind==='plan'){ const m=draft.plan.meals[+el.dataset.i]; if(m){ if(k==='pm-title') m.title=el.value.slice(0,60); else if(k==='pm-items') m.items=el.value.split(/\n|،|,/).map(x=>x.trim()).filter(Boolean).slice(0,20); else { const v=Math.round(parseAmount(el.value)); if(k==='pm-kcal') m.kcal=(v>=0)?v:0; else m.protein=(v>=0)?v:0; } } } }
  else if(k==='fs-name'){ if(draft&&draft.buckets[+el.dataset.i]) draft.buckets[+el.dataset.i].name=el.value; }
  else if(k==='fs-pct'){ if(draft&&draft.buckets[+el.dataset.i]){ const v=parseAmount(el.value); draft.buckets[+el.dataset.i].pct=isFinite(v)&&v>=0?v:0; const sum=draft.buckets.reduce((a,b)=>a+(+b.pct||0),0); const s=$('#fs-sum'); if(s){ s.className='pct-sum '+(Math.round(sum)===100?'ok':'bad'); s.textContent='المجموع: '+Math.round(sum*100)/100+'% '+(Math.round(sum)===100?'✓':'— يجب أن يكون 100%'); } } }
}catch(err){ reportError(err); } });
document.addEventListener('change',e=>{ const el=e.target; const c=el.dataset.change; if(!c) return; try{
  if(c==='due'){ $$('#f-quick button').forEach(b=>b.classList.toggle('on',b.dataset.v===el.value)); }
  else if(c==='repeat'){ const w=el.value==='weekly'; const dd=$('#f-days'); if(dd) dd.hidden=!w; const h=$('#f-rep-hint'); if(h) h.hidden=el.value==='none'; }
  else if(c==='name'){ state.settings.name=el.value.trim().slice(0,40); save(); render(); }
  else if(c==='fs-kind'){ if(draft&&draft.buckets[+el.dataset.i]) draft.buckets[+el.dataset.i].kind=el.value; }
  else if(c==='plan-rest'){ if(draft&&draft.kind==='plan'){ draft.plan.rest=!!el.checked; const w=$('#plan-wo'); if(w) w.hidden=draft.plan.rest; } }
  else if(c==='pi-ex'){ if(draft&&draft.kind==='plan'){ const it=draft.plan.workout.items[+el.dataset.i]; const e=exById(el.value); if(it&&e){ it.exId=e.id; it.sets=e.defSets; it.reps=e.defReps; it.weight=e.defWeight; renderPlanSheet(); } } }
  else if(c==='pm-slot'){ if(draft&&draft.kind==='plan'){ const m=draft.plan.meals[+el.dataset.i]; if(m) m.slot=el.value; } }
}catch(err){ reportError(err); } });
document.addEventListener('change',e=>{ if(e.target&&e.target.id==='avatar-file'){ const f=e.target.files&&e.target.files[0]; if(f) setAvatarFromFile(f); } });

/* ===================== تشغيل ===================== */
applyTheme(); dailyBackup();
if(pendingFinanceSeed){ try{ seedFinanceSamples(); save(); }catch(e){ reportError(e); } pendingFinanceSeed=false; }
if(pendingBodySeed){ try{ seedBodySamples(); save(); }catch(e){ reportError(e); } pendingBodySeed=false; }
if(pendingFitSeed){ try{ seedFitSamples(); save(); }catch(e){ reportError(e); } pendingFitSeed=false; }
if(!FT().foods.length){ try{ seedFoods(); save(); }catch(e){ reportError(e); } }
render();
setInterval(timerTick,1000);
if(state.settings.seeded&&state.settings.skin==='solo'){ setTimeout(()=>{ try{ const d=today(); const n=tasksForDate(d).filter(t=>!isTaskDone(t,d)).length+habitsForDate(d).filter(h=>!isHabitDone(h,d)).length; toast('[ النظام ] مرحبًا '+(state.settings.name||'أيها اللاعب')+(n?' — '+n+' مهام تنتظرك اليوم':' — المهمة اليومية مكتملة'),{ms:3500}); }catch(e){} },700); }
setInterval(()=>{ if(today()!==lastRenderDay) render(); },30000);
})();
</script>
