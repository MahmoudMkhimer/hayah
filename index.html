<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7A78">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>حياة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Changa:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{
  --font-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,Arial,sans-serif;
  --font-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --bg:#F4F6F2; --surface:#FFFFFF; --surface-2:#EAEDE7; --line:#DCE1D9; --line-2:#EEF1EC;
  --text:#1B2328; --text-2:#56626B; --text-3:#8B959C;
  --accent:#0E7A78; --accent-ink:#0B605E; --accent-soft:#D6EEED; --on-accent:#FFFFFF;
  --good:#2C9A58; --good-soft:#DDF2E4; --warn:#BF8418; --warn-soft:#F7EBD0; --bad:#C4423A; --bad-soft:#F8DFDC;
  --overlay:rgba(18,26,30,.45); --shadow:0 10px 30px rgba(20,32,36,.14);
  --toast-bg:#1B2328; --toast-fg:#F4F6F2; --toast-act:#8FD9D6;
  --r:14px; --r-lg:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1417; --surface:#171E22; --surface-2:#1E272C; --line:#2A353B; --line-2:#222C31;
    --text:#E6EBE8; --text-2:#A3AEB5; --text-3:#6E7B83;
    --accent:#3EB4B0; --accent-ink:#86D6D3; --accent-soft:#163837; --on-accent:#07201F;
    --good:#4BC17A; --good-soft:#163425; --warn:#DCA23A; --warn-soft:#382C12; --bad:#E0665C; --bad-soft:#3A1D1A;
    --overlay:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5);
    --toast-bg:#E6EBE8; --toast-fg:#0F1417; --toast-act:#0E7A78;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1417; --surface:#171E22; --surface-2:#1E272C; --line:#2A353B; --line-2:#222C31;
  --text:#E6EBE8; --text-2:#A3AEB5; --text-3:#6E7B83;
  --accent:#3EB4B0; --accent-ink:#86D6D3; --accent-soft:#163837; --on-accent:#07201F;
  --good:#4BC17A; --good-soft:#163425; --warn:#DCA23A; --warn-soft:#382C12; --bad:#E0665C; --bad-soft:#3A1D1A;
  --overlay:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.5);
  --toast-bg:#E6EBE8; --toast-fg:#0F1417; --toast-act:#0E7A78;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--font-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-2);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand .name{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.2;color:var(--accent-ink)}
.brand .date{font-size:13px;color:var(--text-2)}
.top .acts{display:flex;gap:4px}
.icon-btn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}

#view{flex:1;padding:14px 16px 110px}
.section{margin-top:22px}
.section:first-child{margin-top:4px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;padding:0 4px}
.section-h h2{font-size:15px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.section-h .count{font-size:13px;color:var(--text-3)}
.link-btn{color:var(--accent);font-weight:600;font-size:14px;padding:4px 6px;border-radius:8px}
.link-btn:active{background:var(--accent-soft)}

.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.list{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;position:relative}
.row + .row{border-top:1px solid var(--line-2)}
.row-main{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.row-title{font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.row.done .row-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}
.row-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:3px;font-size:12.5px;color:var(--text-3)}
.row-meta .m{display:inline-flex;align-items:center;gap:4px}
.row-meta .m svg{width:13px;height:13px}
.row-meta .late{color:var(--bad);font-weight:600}
.row-meta .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));display:inline-block}
.row.p3::before,.row.p2::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0}
.row.p3::before{background:var(--bad)}
.row.p2::before{background:var(--warn)}

.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:transparent;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chk:active{transform:scale(.92)}

.hbtn{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--c,var(--accent));color:var(--c,var(--accent));display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--c,var(--accent)) 10%,transparent);transition:background .15s}
.hbtn svg{width:20px;height:20px}
.hbtn.on{background:var(--c,var(--accent));color:#fff}
.hbtn:active{transform:scale(.94)}
.mini{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--text-2);font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.dots7{display:inline-flex;gap:3px;align-items:center}
.dots7 i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dots7 i.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.dots7 i.off{opacity:.35}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--warn);font-weight:600}
.streak svg{width:13px;height:13px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--c,var(--accent));transition:width .3s}

.summary{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg)}
.summary .ring{flex:none;width:72px;height:72px;position:relative}
.summary .ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.summary .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:17px}
.summary .txt{flex:1;min-width:0}
.summary .greet{font-size:14px;color:var(--text-2)}
.summary .big{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.3;margin-top:2px}
.summary .sub{font-size:13px;color:var(--text-3);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}

.gcard{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.gcard + .gcard{margin-top:10px}
.gcard .gh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gcard .gt{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.35}
.gcard .gw{font-size:13.5px;color:var(--text-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .gp{display:flex;align-items:center;gap:10px;margin-top:12px}
.gcard .gp .bar{flex:1}
.gcard .gp .pct{font-weight:700;font-size:14px;min-width:38px;text-align:start}
.gcard .gm{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--text-3);margin-top:8px}
.gmini{padding:12px 14px;cursor:pointer}
.gmini + .gmini{border-top:1px solid var(--line-2)}
.gmini .t{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.gmini .t small{color:var(--text-3);font-weight:500;font-size:12.5px;white-space:nowrap}
.gmini .bar{margin-top:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--text-2)}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;margin-bottom:10px}
.search svg{width:18px;height:18px;color:var(--text-3);flex:none}
.search input{flex:1;border:0;background:none;height:100%;min-width:0;font-size:16px}
.search input::placeholder{color:var(--text-3)}

.empty{text-align:center;padding:34px 20px;color:var(--text-2)}
.empty .ill{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.empty .ill svg{width:28px;height:28px}
.empty h3{font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px}
.empty p{margin:0 auto;max-width:34ch;font-size:14px}
.empty .btn{margin-top:14px}

.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:14px;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:12px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner span{flex:1}
.banner .btn{padding:6px 12px;font-size:13px;height:auto;background:var(--surface);color:inherit}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;background:var(--surface-2);color:var(--text);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:14px}
.btn svg{width:18px;height:18px}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row .btn{flex:1}

.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:25;transition:transform .12s}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.94)}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:24;background:var(--surface);border-top:1px solid var(--line-2);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 4px;border-radius:12px;color:var(--text-3);font-size:12px;font-weight:500;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent-ink)}
.tab.on svg{color:var(--accent)}
.tab .badge{position:absolute;top:4px;inset-inline-end:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

#sheet-root{position:fixed;inset:0;z-index:40;display:none}
#sheet-root.open{display:block}
.sheet-bg{position:absolute;inset:0;background:var(--overlay);animation:fade .18s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px 10px;flex:none}
.sheet-h h3{font-size:19px;font-weight:600}
.sheet-body{overflow-y:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field > label,.field .lbl{font-size:13px;font-weight:600;color:var(--text-2)}
.inp,.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{height:40px;border-radius:10px;background:var(--surface-2);font-weight:600;color:var(--text-2)}
.days button.on{background:var(--accent);color:var(--on-accent)}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchips button{height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;color:var(--text-2)}
.qchips button.on{background:var(--accent);color:var(--on-accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--c)}
.sublist{display:flex;flex-direction:column;gap:6px}
.subitem{display:flex;align-items:center;gap:10px;min-height:40px;padding:2px 4px}
.subitem .chk{width:24px;height:24px}
.subitem .chk svg{width:14px;height:14px}
.subitem span{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.subitem.done span{color:var(--text-3);text-decoration:line-through}
.subitem .x{width:32px;height:32px;border-radius:8px;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;flex:none}
.subitem .x svg{width:16px;height:16px}
.addline{display:flex;gap:8px}
.addline input{flex:1}
.addline .btn{height:48px;width:52px;padding:0;flex:none}
.form-actions{display:flex;gap:10px;margin-top:22px}
.form-actions .btn.primary{flex:1}
.hint{font-size:12.5px;color:var(--text-3);margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.2}
.stat small{font-size:11.5px;color:var(--text-3)}
.heat-wrap{overflow-x:auto;margin-top:14px;padding-bottom:4px;direction:ltr}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;width:max-content}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface-2);display:block}
.heat i.on{background:var(--c,var(--accent))}
.heat i.off{opacity:.3}
.heat i.today{outline:1.5px solid var(--text-2);outline-offset:-1.5px}
.detail-h{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.detail-h h3{font-size:22px;font-weight:700;line-height:1.3}
.detail-h .why{color:var(--text-2);font-size:14.5px;white-space:pre-wrap}
.detail-h .metas{display:flex;flex-wrap:wrap;gap:6px}
.dsec{margin-top:18px}
.dsec h4{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;align-items:center}
.dsec .list .row{min-height:50px;padding:8px 12px}
.acts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.acts-grid .btn.wide{grid-column:1/-1}
.collapse{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 4px;color:var(--text-2);font-weight:600;font-size:14px}
.collapse svg{width:18px;height:18px;transition:transform .15s}
.collapse.open svg{transform:rotate(180deg)}

#toast{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast-in{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--toast-bg);color:var(--toast-fg);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);font-size:14.5px;max-width:520px;animation:up .2s ease}
.toast-btn{color:var(--toast-act);font-weight:700;padding:4px 8px;border-radius:8px}
#err{position:fixed;top:0;left:0;right:0;z-index:60;padding:0 12px}
.errbar{max-width:536px;margin:8px auto;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.errbar span{flex:1;min-width:180px}
.errbar button{font-weight:700;padding:6px 10px;border-radius:8px;background:var(--surface)}
.export-box{width:100%;min-height:120px;font-size:12px;font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left}
.welcome h3{font-size:24px;font-weight:700}
.welcome p{color:var(--text-2);margin:8px 0 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
.kv:last-child{border-bottom:0}

function commit(label,mutate,opts){
  opts=opts||{};
  const before=JSON.stringify(state); let lvBefore=1; try{ lvBefore=levelInfo().L; }catch(e){}
  mutate();
  if(typeof label==='function'){ try{ label=label(); }catch(e){ label=null; } }
  save(); render();
  let lvAfter=lvBefore; try{ lvAfter=levelInfo().L; }catch(e){}
  const undo=opts.noUndo?null:function(){ state=migrate(sanitize(JSON.parse(before))); save(); render(); };
  if(lvAfter>lvBefore){ try{ showLevelUp(lvBefore,lvAfter); }catch(e){ toast(L().levelUp+lvAfter,{ms:5000,cls:'lvlup'}); } }
  if(label) toast(label,{undo:undo,ms:opts.ms});
}
let toastTimer=null;
function toast(msg,o){
  o=o||{}; const t=$('#toast');
  t.innerHTML='<div class="toast-in'+(o.cls?' '+o.cls:'')+'"><span>'+esc(msg)+'</span>'+(o.undo?'<button class="toast-btn" id="toast-undo">تراجع</button>':'')+'</div>';
  if(o.undo){ $('#toast-undo').onclick=function(){ o.undo(); hideToast(); toast('تم التراجع',{ms:1600}); }; }
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,o.ms||5000);
}
function hideToast(){ $('#toast').innerHTML=''; }

/* ===================== منطق المهام ===================== */
function taskStart(t){ return t.due||t.createdAt.slice(0,10); }
function isScheduled(t,d){
  if(t.archived) return false;
  if(!t.repeat) return t.due===d;
  const start=taskStart(t); if(d<start) return false;
  const r=t.repeat, dd=parseISO(d);
  if(r.type==='daily') return true;
  if(r.type==='weekly') return r.days.includes(dd.getDay());
  if(r.type==='monthly') return dd.getDate()===parseISO(start).getDate();
  return false;
}
function isTaskDone(t,d){ return t.repeat? !!t.completions[d] : !!t.done; }
function sortTasks(a,b){ const da=a.done?1:0, db=b.done?1:0; if(da!==db) return da-db; if(b.priority!==a.priority) return b.priority-a.priority; if((a.time||'')!==(b.time||'')) return (a.time||'99')<(b.time||'99')?-1:1; return (a.createdAt||'')<(b.createdAt||'')?-1:1; }
function tasksForDate(d){ return state.tasks.filter(t=>isScheduled(t,d)).sort((a,b)=>{ const da=isTaskDone(a,d)?1:0, db=isTaskDone(b,d)?1:0; if(da!==db) return da-db; return sortTasks(a,b); }); }
function overdueTasks(d){ return state.tasks.filter(t=>!t.archived&&!t.repeat&&!t.done&&t.due&&t.due<d).sort(sortTasks); }
function repeatText(r,start){ if(!r) return ''; if(r.type==='daily') return 'كل يوم'; if(r.type==='weekly'){ if(r.days.length===7) return 'كل يوم'; if(!r.days.length) return 'أسبوعي'; return 'كل '+r.days.slice().sort().map(i=>WD[i]).join('، '); } if(r.type==='monthly') return 'كل شهر يوم '+parseISO(start).getDate(); return ''; }
function nextOccurrence(t,d){ for(let i=0;i<400;i++){ const x=addDays(d,i); if(isScheduled(t,x)) return x; } return null; }
function taskRow(t,d,o){
  o=o||{}; const done=isTaskDone(t,d); const late=!t.repeat&&!t.done&&t.due&&t.due<d;
  const subs=t.subtasks.length? '<span class="m">'+ICON.list+'<span class="num">'+t.subtasks.filter(s=>s.done).length+'/'+t.subtasks.length+'</span></span>':'';
  const due= t.repeat? '<span class="m">'+ICON.repeat+esc(repeatText(t.repeat,taskStart(t)))+'</span>' : (t.due&&o.showDue!==false? '<span class="m'+(late?' late':'')+'">'+ICON.cal+esc(dueLabel(t.due,d))+'</span>':'');
  const time=t.time?'<span class="m">'+ICON.clock+esc(fmtTime(t.time))+'</span>':'';
  const meta=[due,time,goalChip(t.goalId),subs].filter(Boolean).join('');
  return '<div class="row task p'+t.priority+(done?' done':'')+'">'
    +'<button class="chk'+(done?' on':'')+'" data-action="toggle-task" data-id="'+t.id+'" data-date="'+d+'" aria-label="'+(done?'إلغاء الإنجاز':'تم')+'">'+ICON.check+'</button>'
    +'<div class="row-main" data-action="edit-task" data-id="'+t.id+'"><div class="row-title">'+esc(t.title)+(t.sample?'<span class="sample-tag">مثال</span>':'')+'</div>'+(meta?'<div class="row-meta">'+meta+'</div>':'')+'</div></div>';
}

/* ===================== منطق العادات ===================== */
function habitStartDay(h){ return h.createdAt.slice(0,10); }
function isHabitScheduled(h,d){ if(h.archived) return false; if(d<habitStartDay(h)) return false; return h.days.includes(parseISO(d).getDay()); }
function habitCount(h,d){ return h.log[d]||0; }
function isHabitDone(h,d){ return habitCount(h,d)>=h.target; }
function habitsForDate(d){ return state.habits.filter(h=>isHabitScheduled(h,d)).sort((a,b)=>{ const da=isHabitDone(a,d)?1:0, db=isHabitDone(b,d)?1:0; if(da!==db) return da-db; return (a.createdAt||'')<(b.createdAt||'')?-1:1; }); }
function habitStreak(h,d){
  let s=0, cur=d, start=habitStartDay(h);
  if(isHabitScheduled(h,cur)&&!isHabitDone(h,cur)) cur=addDays(cur,-1);
  for(let i=0;i<4000&&cur>=start;i++){ if(h.days.includes(parseISO(cur).getDay())){ if(isHabitDone(h,cur)) s++; else break; } cur=addDays(cur,-1); }
  return s;
}
function habitBest(h,d){ let best=0, run=0, cur=habitStartDay(h); for(let i=0;i<4000&&cur<=d;i++){ if(h.days.includes(parseISO(cur).getDay())){ if(isHabitDone(h,cur)){ run++; if(run>best) best=run; } else if(cur!==d) run=0; } cur=addDays(cur,1); } return best; }
function habitRate(h,d,n){ let sch=0, done=0; for(let i=0;i<n;i++){ const x=addDays(d,-i); if(x<habitStartDay(h)) break; if(h.days.includes(parseISO(x).getDay())){ sch++; if(isHabitDone(h,x)) done++; } } return sch? Math.round(done/sch*100):0; }
function habitTotal(h){ let n=0; for(const k in h.log){ if(h.log[k]>=h.target) n++; } return n; }
function dots7(h,d){ let s='<span class="dots7" style="--c:'+esc(h.color)+'">'; for(let i=6;i>=0;i--){ const x=addDays(d,-i); const sch=h.days.includes(parseISO(x).getDay())&&x>=habitStartDay(h); s+='<i class="'+(isHabitDone(h,x)?'on':(sch?'':'off'))+'"></i>'; } return s+'</span>'; }
function habitRow(h,d){
  const c=habitCount(h,d), done=isHabitDone(h,d), streak=habitStreak(h,d);
  const inner= h.target>1? '<span class="hcount num">'+c+'/'+h.target+'</span>' : ICON.check;
  const meta=[ streak?'<span class="streak">'+ICON.flame+'<span class="num">'+streak+'</span></span>':'', h.type==='quit'?'<span class="m">أتخلص منها</span>':'', h.unit&&h.target>1?'<span class="m">'+esc(h.unit)+'</span>':'', goalChip(h.goalId), dots7(h,d) ].filter(Boolean).join('');
  return '<div class="row habit'+(done?' done':'')+'" style="--c:'+esc(h.color)+'">'
    +'<button class="hbtn'+(done?' on':'')+'" data-action="habit-inc" data-id="'+h.id+'" data-date="'+d+'" aria-label="'+(h.type==='quit'?'التزمت النهاردة':'تم')+'">'+inner+'</button>'
    +'<div class="row-main" data-action="open-habit" data-id="'+h.id+'"><div class="row-title">'+esc(h.title)+(h.sample?'<span class="sample-tag">مثال</span>':'')+'</div><div class="row-meta">'+meta+'</div></div>'
    +(c>0&&h.target>1?'<button class="mini" data-action="habit-dec" data-id="'+h.id+'" data-date="'+d+'" aria-label="تقليل">−</button>':'')
    +'</div>';
}

/* ===================== منطق الأهداف ===================== */
function goalTasks(g){ return state.tasks.filter(t=>t.goalId===g.id&&!t.archived); }
function goalHabits(g){ return state.habits.filter(h=>h.goalId===g.id&&!h.archived); }
function goalProgress(g){
  if(g.status==='done') return 100;
  const ms=g.milestones; if(ms.length) return Math.round(ms.filter(m=>m.done).length/ms.length*100);
  const ts=goalTasks(g).filter(t=>!t.repeat); if(ts.length) return Math.round(ts.filter(t=>t.done).length/ts.length*100);
  return 0;
}
function deadlineLabel(g,d){ if(!g.deadline) return ''; const diff=daysBetween(d,g.deadline); if(g.status==='done') return 'أُنجز'; if(diff<0) return 'فات الموعد بـ'+nDays(diff); if(diff===0) return 'الموعد اليوم'; return 'باقي '+nDays(diff); }
function deadlineClass(g,d){ if(!g.deadline||g.status==='done') return ''; const diff=daysBetween(d,g.deadline); if(diff<0) return 'bad'; if(diff<=7) return 'warn'; return ''; }
function activeGoals(){ return state.goals.filter(g=>g.status==='active').sort((a,b)=>{ if(a.deadline&&b.deadline) return a.deadline<b.deadline?-1:1; if(a.deadline) return -1; if(b.deadline) return 1; return (a.createdAt||'')<(b.createdAt||'')?-1:1; }); }
function goalCard(g,d){
  const p=goalProgress(g), tasks=goalTasks(g), habits=goalHabits(g), ms=g.milestones;
  const counts=[ ms.length?nOf(ms.length,'مرحلة واحدة','مرحلتان','مراحل','مرحلة'):'', tasks.length?nOf(tasks.length,'مهمة واحدة','مهمتان','مهام','مهمة'):'', habits.length?nOf(habits.length,'عادة واحدة','عادتان','عادات','عادة'):'' ].filter(Boolean);
  const dl=deadlineLabel(g,d);
  return '<div class="gcard" role="button" tabindex="0" data-action="open-goal" data-id="'+g.id+'" style="--c:'+esc(g.color)+'">'
    +'<div class="gh"><div><div class="gt">'+esc(g.title)+(g.sample?'<span class="sample-tag">مثال</span>':'')+'</div>'+(g.why?'<div class="gw">'+esc(g.why)+'</div>':'')+'</div><span class="chip">'+esc(AREAS[g.area])+'</span></div>'
    +'<div class="gp"><div class="bar"><i style="width:'+p+'%"></i></div><span class="pct num">'+p+'%</span></div>'
    +'<div class="gm">'+(dl?'<span class="'+deadlineClass(g,d)+'" style="'+(deadlineClass(g,d)?'color:var(--'+deadlineClass(g,d)+');font-weight:600':'')+'">'+esc(dl)+'</span>':'')+counts.map(c=>'<span>'+esc(c)+'</span>').join('')+(!dl&&!counts.length?'<span>اضغط لإضافة مراحل أو مهام</span>':'')+'</div></div>';
}

/* ===================== شاشة المهام ===================== */
const TASK_FILTERS=[['today','اليوم'],['upcoming','القادم'],['someday','بدون موعد'],['repeat','متكررة'],['all','الكل'],['done','المكتملة']];
function bucketOf(t,d){ if(t.repeat) return 'repeat'; if(t.done) return 'done'; if(!t.due) return 'someday'; const diff=daysBetween(d,t.due); if(diff<0) return 'late'; if(diff===0) return 'today'; if(diff===1) return 'tomorrow'; if(diff<7) return 'week'; return 'later'; }
const BUCKET_LABEL={late:'متأخر',today:'اليوم',tomorrow:'غدًا',week:'هذا الأسبوع',later:'لاحقًا',someday:'بدون موعد',repeat:'متكررة',done:'مكتملة'};
const BUCKET_ORDER=['late','today','tomorrow','week','later','someday','repeat'];
function renderTasks(){
  const d=today(), f=filters.tasks, q=filters.q.trim().toLowerCase();
  const seg='<div class="seg" style="margin-bottom:10px"><button type="button" data-action="task-view" data-v="tasks" class="'+(filters.taskView!=='habits'?'on':'')+'">المهام</button><button type="button" data-action="task-view" data-v="habits" class="'+(filters.taskView==='habits'?'on':'')+'">العادات</button></div>';
  if(filters.taskView==='habits') return seg+renderHabits();
  let out=seg+'<div class="search">'+ICON.search+'<input type="search" id="task-q" data-input="task-q" placeholder="ابحث في المهام" value="'+esc(filters.q)+'" enterkeyhint="search">'+(q?'<button class="icon-btn" data-action="clear-q" aria-label="مسح البحث">'+ICON.x+'</button>':'')+'</div>';
  out+='<div class="chips">'+TASK_FILTERS.map(x=>'<button class="fchip'+(f===x[0]?' on':'')+'" data-action="filter-tasks" data-f="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  let pool=state.tasks.filter(t=>!t.archived);
  if(q) pool=pool.filter(t=>(t.title+' '+(t.note||'')+' '+t.subtasks.map(s=>s.title).join(' ')).toLowerCase().includes(q));
  const groups={}; const push=(k,t)=>{ (groups[k]=groups[k]||[]).push(t); };
  if(f==='today'){ pool.forEach(t=>{ if(t.repeat){ if(isScheduled(t,d)) push('today',t); return; } const b=bucketOf(t,d); if(b==='late'||b==='today') push(b,t); }); }
  else if(f==='upcoming'){ pool.forEach(t=>{ if(t.repeat){ const n=nextOccurrence(t,addDays(d,1)); if(n&&daysBetween(d,n)<=30) push('repeat',t); return; } const b=bucketOf(t,d); if(['tomorrow','week','later'].includes(b)) push(b,t); }); }
  else if(f==='someday'){ pool.forEach(t=>{ if(!t.repeat&&!t.done&&!t.due) push('someday',t); }); }
  else if(f==='repeat'){ pool.forEach(t=>{ if(t.repeat) push('repeat',t); }); }
  else if(f==='all'){ pool.forEach(t=>{ const b=bucketOf(t,d); if(b!=='done') push(b,t); }); }
  else if(f==='done'){ pool.filter(t=>!t.repeat&&t.done).sort((a,b)=>(b.doneAt||'')<(a.doneAt||'')?-1:1).forEach(t=>push('done',t)); }
  const keys=BUCKET_ORDER.concat(['done']).filter(k=>groups[k]&&groups[k].length);
  if(!keys.length){
    const msgs={today:['يومك خالص','مفيش مهام مستحقة اليوم ولا متأخرة.'],upcoming:['لا شيء قادم','أضف مهام بمواعيد مستقبلية وستظهر هنا.'],someday:['لا مهام بدون موعد','المهام اللي من غير موعد بتظهر هنا لحد ما تحدد لها يوم.'],repeat:['لا مهام متكررة','أي مهمة تتكرر يوميًا أو أسبوعيًا أو شهريًا تظهر هنا.'],all:['القائمة فاضية','أضف مهمتك الأولى من الزر بالأسفل.'],done:['لا مهام مكتملة بعد','أول مهمة تخلصها هتظهر هنا.']};
    const m=q?['لا نتائج','لا توجد مهمة تطابق "'+filters.q+'".']:msgs[f];
    return out+'<div class="card" style="margin-top:6px">'+emptyBlock(ICON.list,m[0],m[1],q?'':'<button class="btn primary sm" data-action="add-task"'+(f==='today'?' data-due="'+d+'"':'')+'>إضافة مهمة</button>')+'</div>';
  }
  keys.forEach(k=>{
    const arr=groups[k]; if(k!=='done') arr.sort(sortTasks);
    if(k==='done'){ out+='<div class="section">'+sectionH('مكتملة',arr.length,arr.length?'<button class="link-btn" data-action="archive-done">إخفاء الكل</button>':'')+'<div class="list">'+arr.slice(0,150).map(t=>taskRow(t,d)).join('')+'</div>'+(arr.length>150?'<p class="hint">يتم عرض آخر 150 مهمة.</p>':'')+'</div>'; return; }
    if(k==='later'){ arr.sort((a,b)=>a.due<b.due?-1:1); }
    out+='<div class="section">'+sectionH(BUCKET_LABEL[k],arr.length)+'<div class="list">'+arr.map(t=>taskRow(t,d,{showDue:k!=='today'})).join('')+'</div></div>';
  });
  return out;
}

/* ===================== المال — منطق ===================== */
const KIND_LABEL={obligations:'التزامات',invest:'استثمار',personal:'شخصي',custom:'مخصص'};
function F(){ return state.finance; }
const ym=d=>String(d).slice(0,7);
function curMonth(){ return ym(today()); }
function monthLabel(m){ const p=m.split('-').map(Number); return MONTHS[p[1]-1]+' '+p[0]; }
function addMonths(m,n){ const p=m.split('-').map(Number); const d=new Date(p[0],p[1]-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function round2(n){ return Math.round(n*100)/100; }
function parseAmount(v){ v=String(v==null?'':v).trim().replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[،,\s]/g,'').replace('٫','.'); const n=parseFloat(v); return isFinite(n)?round2(n):NaN; }
function agoLabel(date){ const n=daysBetween(date,today()); if(n<0) return dueLabel(date,today()); if(n===0) return 'اليوم'; if(n===1) return 'أمس'; if(n<7) return 'منذ '+nDays(n); return fmtDate(date); }
function fmtNum(n){ n=round2(n||0); const neg=n<0; n=Math.abs(n); const s=(n%1)?n.toFixed(2).replace(/0+$/,''):String(n); const parts=s.split('.'); return (neg?'−':'')+parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(parts[1]?'.'+parts[1]:''); }
function money(n,cls){ return '<span class="num'+(cls?' '+cls:'')+'">'+fmtNum(n)+'</span> <small>'+esc(F().currency)+'</small>'; }
function sortedBuckets(){ return F().buckets.slice().sort((a,b)=>a.order-b.order); }
function bucketById(id){ return F().buckets.find(b=>b.id===id)||null; }
function splitByPct(amount,buckets){ buckets=buckets||sortedBuckets(); const tot=buckets.reduce((a,b)=>a+(+b.pct||0),0)||1; const out={}; let acc=0; buckets.forEach((b,i)=>{ let v=i===buckets.length-1? round2(amount-acc) : round2(amount*(+b.pct||0)/tot); if(v<0) v=0; out[b.id]=v; acc=round2(acc+v); }); return out; }
function bucketMonth(b,m){ let alloc=0,spent=0,tin=0,tout=0; F().incomes.forEach(i=>{ if(ym(i.date)===m) alloc+=(+i.split[b.id]||0); }); F().expenses.forEach(e=>{ if(e.bucketId===b.id&&ym(e.date)===m) spent+=e.amount; }); F().transfers.forEach(t=>{ if(ym(t.date)===m){ if(t.to===b.id) tin+=t.amount; if(t.from===b.id) tout+=t.amount; } }); return {alloc:round2(alloc),spent:round2(spent),tin:round2(tin),tout:round2(tout),net:round2(alloc+tin-tout-spent)}; }
function bucketBalanceBefore(b,m){ let bal=0; F().incomes.forEach(i=>{ if(ym(i.date)<m) bal+=(+i.split[b.id]||0); }); F().expenses.forEach(e=>{ if(e.bucketId===b.id&&ym(e.date)<m) bal-=e.amount; }); F().transfers.forEach(t=>{ if(ym(t.date)<m){ if(t.to===b.id) bal+=t.amount; if(t.from===b.id) bal-=t.amount; } }); return round2(bal); }
function activeRepair(b,m){ const rs=F().repairs.filter(r=>r.bucketId===b.id&&r.startMonth<=m&&m<addMonths(r.startMonth,r.months)); return rs.length?rs[rs.length-1]:null; }
function bucketState(b,m){
  const bm=bucketMonth(b,m), carried=bucketBalanceBefore(b,m), balance=round2(carried+bm.net);
  const repair=activeRepair(b,m); const deficitCarried=carried<0?-carried:0;
  const repay= deficitCarried? (repair? Math.min(round2(repair.amount/repair.months),deficitCarried) : deficitCarried) : 0;
  const available=round2(bm.alloc+bm.tin-bm.tout-bm.spent+(carried>0?carried:0)-repay);
  let status='ok'; if(balance<0) status='deficit'; else if(bm.alloc+bm.tin-bm.tout>0&&bm.spent>bm.alloc+bm.tin-bm.tout) status='over'; else if(b.kind==='invest'&&bm.spent>0) status='touched';
  return Object.assign(bm,{carried,balance,available,status,repair,repay,deficitCarried});
}
function monthIncome(m){ return round2(F().incomes.filter(i=>ym(i.date)===m).reduce((a,i)=>a+i.amount,0)); }
function monthSpent(m){ return round2(F().expenses.filter(e=>ym(e.date)===m).reduce((a,e)=>a+e.amount,0)); }
function monthStatus(m){ const det=sortedBuckets().map(b=>({b,s:bucketState(b,m)})); return {income:monthIncome(m),spent:monthSpent(m),det,deficits:det.filter(x=>x.s.status==='deficit'),overs:det.filter(x=>x.s.status==='over')}; }
function activeMonths(){ const set=new Set(); F().incomes.forEach(i=>set.add(ym(i.date))); F().expenses.forEach(e=>set.add(ym(e.date))); F().transfers.forEach(t=>set.add(ym(t.date))); return Array.from(set).sort(); }
function hasFinanceData(){ return F().incomes.length+F().expenses.length+F().transfers.length>0; }
function statusChip(s){ return s==='deficit'?'<span class="chip bad">عجز</span>':s==='over'?'<span class="chip warn">من الفائض</span>':s==='touched'?'<span class="chip warn">مسست الاستثمار</span>':'<span class="chip good">سليم</span>'; }
function allTx(){ const arr=[]; F().incomes.forEach(i=>arr.push({k:'income',d:i.date,o:i})); F().expenses.forEach(e=>arr.push({k:'expense',d:e.date,o:e})); F().transfers.forEach(t=>arr.push({k:'transfer',d:t.date,o:t})); return arr.sort((a,b)=>a.d===b.d?((b.o.createdAt||'')<(a.o.createdAt||'')?-1:1):(a.d<b.d?1:-1)); }
function txMatches(x,q){ q=q.toLowerCase(); const o=x.o; const bits=[o.note||'',o.category||'',String(o.amount),fmtNum(o.amount),o.date, x.k==='income'?'دخل':x.k==='transfer'?'تحويل':'مصروف']; const b=o.bucketId?bucketById(o.bucketId):null; if(b) bits.push(b.name); return bits.join(' ').toLowerCase().indexOf(q)>=0; }
function monthTx(m){ const arr=[]; F().incomes.forEach(i=>{ if(ym(i.date)===m) arr.push({k:'income',d:i.date,o:i}); }); F().expenses.forEach(e=>{ if(ym(e.date)===m) arr.push({k:'expense',d:e.date,o:e}); }); F().transfers.forEach(t=>{ if(ym(t.date)===m) arr.push({k:'transfer',d:t.date,o:t}); }); return arr.sort((a,b)=>a.d===b.d?((b.o.createdAt||'')<(a.o.createdAt||'')?-1:1):(a.d<b.d?1:-1)); }

function bucketCard(b,m){

function saveFinSettings(form){

function xpBreakdown(){ let tasks=0,habits=0,goals=0,money=0; state.tasks.forEach(t=>{ if(t.repeat) tasks+=10*Object.keys(t.completions||{}).length; else if(t.done) tasks+=10; }); state.habits.forEach(h=>{ for(const k in h.log) if(h.log[k]>=h.target) habits+=5; }); state.goals.forEach(g=>{ goals+=20*g.milestones.filter(x=>x.done).length; if(g.status==='done') goals+=100; }); const cm=curMonth(); activeMonths().forEach(m=>{ if(m<cm){ const s=monthStatus(m); if(s.income>0&&!s.deficits.length) money+=30; } }); const daily=25*(state.settings.dailyDone||[]).length; let body=0; (state.body&&state.body.sessions||[]).forEach(x=>{ body+=sessionXP(x); }); let deen=0; try{ deen=deenXP(); }catch(e){} let fit=0; try{ fit=fitXP(); }catch(e){} return {tasks,habits,goals,money,daily,body,deen,fit,total:tasks+habits+goals+money+daily+body+deen+fit}; }
function levelFor(xp){ return Math.floor(Math.sqrt(xp/40))+1; }
function levelInfo(){ const xp=xpBreakdown().total; const L=levelFor(xp); const cur=40*(L-1)*(L-1), next=40*L*L; return {xp,L,cur,next,pct:Math.max(0,Math.min(100,Math.round((xp-cur)/(next-cur)*100))),toNext:next-xp}; }

function setAvatarFromFile(file){

function nextSys(){ const o=sysQueue.shift(); if(!o){ sysBusy=false; return; } sysBusy=true; const root=$('#overlay'); root.innerHTML='<div class="sys-win glitch" role="dialog"><div class="sys-h">'+esc(o.head||'النظام')+'</div>'+(o.big!=null?'<div class="sys-big num" id="sys-big">'+esc(o.bigFrom!=null?o.bigFrom:o.big)+'</div>':'')+'<div class="sys-title">'+esc(o.title||'')+'</div>'+(o.sub?'<div class="sys-sub">'+o.sub+'</div>':'')+'<div class="sys-foot">اضغط للمتابعة</div></div>'; root.hidden=false; root.onclick=closeSys; vibrate(o.vib||[30,40,30]);

function B(){ return state.body; }
const SKINDS=[['cardio','كارديو','heart'],['walk','مشي','heart'],['sport','رياضة','heart'],['strength','قوة / مقاومة','body'],['flex','مرونة / إطالة','body'],['study','مذاكرة','mind'],['read','قراءة','mind'],['practice','تدريب مهارة','skill'],['other','أخرى','none']];
const KIND_NAME={}; SKINDS.forEach(k=>KIND_NAME[k[0]]=k[1]);
const HEART_K=['cardio','walk','sport'], BODY_K=['strength','flex'], MIND_K=['study','read','practice'];
const INT_F={1:1,2:1.5,3:2};
const HEART_PATH='M60 100 C 22 72, 6 52, 6 33 C 6 16, 20 6, 35 6 C 46 6, 55 13, 60 23 C 65 13, 74 6, 85 6 C 100 6, 114 16, 114 33 C 114 52, 98 72, 60 100 Z';

const MASTERY=[[0,'مبتدئ'],[10,'متعلّم'],[50,'ممارس'],[150,'متقدّم'],[400,'خبير'],[1000,'أستاذ']];
function tierOf(score){ let t=TIERS[0],i=0; TIERS.forEach((x,k)=>{ if(score>=x[0]){ t=x; i=k; } }); return {name:t[1],idx:i}; }
function recencyW(n){ return n<=7?1:n<=14?.75:n<=21?.5:n<=28?.25:0; }
function loadOf(kinds,ref){ let s=0; B().sessions.forEach(x=>{ if(!kinds.includes(x.kind)) return; const n=daysBetween(x.date,ref); if(n<0||n>28) return; s+=x.minutes*(INT_F[x.intensity]||1)*recencyW(n); }); return s; }
function weeksActive(kinds,ref,n){ let c=0; for(let w=0;w<n;w++){ const to=addDays(ref,-w*7), from=addDays(to,-6); if(B().sessions.filter(x=>kinds.includes(x.kind)&&x.date>=from&&x.date<=to).length>=3) c++; } return c; }
function latestMetric(field,ref){ ref=ref||today(); const arr=B().metrics.filter(m=>m[field]!=null&&m.date<=ref).sort((a,b)=>a.date<b.date?1:-1); return arr[0]||null; }
function heartScore(ref){ ref=ref||today(); const loadS=Math.min(60,loadOf(HEART_K,ref)/600*60); const m=latestMetric('rhr',ref); const hrS=m?Math.max(0,Math.min(30,(90-m.rhr)/35*30)):0; const cons=weeksActive(HEART_K,ref,8)*1.25; return Math.round(Math.min(100,5+loadS+hrS+cons)); }
function bodyScore(ref){ ref=ref||today(); const s=Math.min(65,loadOf(BODY_K,ref)/500*65); const c=Math.min(15,loadOf(HEART_K,ref)/600*15); const cons=weeksActive(BODY_K,ref,8)*1.5; return Math.round(Math.min(100,5+s+c+cons)); }
function mindScore(ref){ ref=ref||today(); const s=Math.min(60,loadOf(MIND_K,ref)/900*60); const learnGoals=state.goals.filter(g=>g.area==='learn'); const ms=Math.min(20,learnGoals.reduce((a,g)=>a+g.milestones.filter(x=>x.done).length,0)*2); const gids=new Set(learnGoals.map(g=>g.id)); let hd=0; state.habits.forEach(h=>{ if(!gids.has(h.goalId)) return; for(let i=0;i<28;i++){ const x=addDays(ref,-i); if((h.log[x]||0)>=h.target) hd++; } }); return Math.round(Math.min(100,5+s+ms+Math.min(15,hd*0.6))); }
function skillHours(s,upto){ let m=0; B().sessions.forEach(x=>{ if(x.skillId===s.id&&(!upto||x.date<=upto)) m+=x.minutes; }); return round2(m/60); }

/* ===================== العبادة — منطق ===================== */
function DN(){ return state.deen; }
function dayPrayers(d){ return DN().prayers[d]||{}; }
function dayAdhkar(d){ return DN().adhkar[d]||{}; }
function ensureDay(store,d){ if(!store[d]) store[d]={}; return store[d]; }
function prayerXP(v){ return v==='j'?7:v==='t'?5:v==='q'?2:0; }
function prayersDone(d){ const p=dayPrayers(d); return PRAYERS.filter(x=>p[x[0]]).length; }
function adhkarCounts(d,set){ const a=dayAdhkar(d)[set]||{}; const items=ADHKAR[set].items; let done=0; items.forEach((it,i)=>{ if((a[i]||0)>=it.n) done++; }); return {done,total:items.length,complete:done===items.length}; }
function prayerRuns(d){ return dayAdhkar(d).prayerRuns||0; }
function wirdPages(d){ return DN().quran.reads.filter(r=>r.date===d).reduce((a,r)=>a+r.pages,0); }
function wirdTarget(){ return DN().quran.wirdPages||0; }
function wirdMet(d){ return wirdTarget()>0&&wirdPages(d)>=wirdTarget(); }
function khatmaStats(){ const total=DN().quran.reads.reduce((a,r)=>a+r.pages,0); const done=Math.floor(total/MUSHAF_PAGES); const cur=total-done*MUSHAF_PAGES; return {total,done,cur,pct:Math.round(cur/MUSHAF_PAGES*100),juz:Math.min(30,Math.floor(cur/(MUSHAF_PAGES/30))+1)}; }
function memoOf(n){ return DN().quran.memo[String(n)]||null; }
function memoAyahs(n){ const m=memoOf(n); if(!m) return 0; return m.status==='done'?SURAHS[n-1][1]:Math.min(SURAHS[n-1][1],m.ayahs||0); }
function memoStats(){ let surahs=0, ayahs=0, learning=0, due=0; const d=today(); for(let n=1;n<=114;n++){ const m=memoOf(n); if(!m) continue; ayahs+=memoAyahs(n); if(m.status==='done'){ surahs++; if(m.next&&m.next<=d) due++; } else if(m.status==='learning'&&(m.ayahs||0)>0) learning++; } return {surahs,ayahs,learning,due,pct:Math.round(ayahs/TOTAL_AYAHS*1000)/10}; }
function dueReviews(){ const d=today(); const out=[]; for(let n=1;n<=114;n++){ const m=memoOf(n); if(m&&m.status==='done'&&m.next&&m.next<=d) out.push(n); } return out; }
function prayerStreak(d){ let s=0, cur=d; if(prayersDone(cur)<5) cur=addDays(cur,-1); for(let i=0;i<4000;i++){ if(prayersDone(cur)===5){ s++; cur=addDays(cur,-1); } else break; } return s; }
function spiritScore(ref){ ref=ref||today(); let pp=0, ad=0, wd=0; for(let i=0;i<28;i++){ const x=addDays(ref,-i); const p=dayPrayers(x); PRAYERS.forEach(k=>{ const v=p[k[0]]; if(v==='j'||v==='t') pp+=1; else if(v==='q') pp+=.5; }); if(adhkarCounts(x,'morning').complete) ad++; if(adhkarCounts(x,'evening').complete) ad++; if(wirdTarget()>0&&wirdPages(x)>=wirdTarget()) wd++; }
  const ms=memoStats(); const rev=(ms.surahs>0)?(ms.due===0?10:Math.max(0,10-ms.due*2)):0;
  return Math.round(Math.min(100,5+pp/140*40+ad/56*25+(wirdTarget()>0?wd/28*20:0)+rev)); }

    +'<div class="field" id="f-ayahs-wrap"'+(draft.status==='learning'?'':' hidden')+'><label for="f-ayahs">الآيات المحفوظة حتى الآن (من '+ay+')</label><input id="f-ayahs" class="inp num" type="text" inputmode="numeric" name="ayahs" value="'+(m.ayahs||0)+'"></div>'
    +(m.status==='done'?'<div class="card" style="padding:12px 14px;margin-top:12px"><div class="kv"><span>آخر مراجعة</span><span>'+(m.last?esc(agoLabel(m.last)):'—')+'</span></div><div class="kv"><span>المراجعة القادمة</span><span style="'+(m.next&&m.next<=today()?'color:var(--bad);font-weight:600':'')+'">'+(m.next?(m.next<=today()?'مستحقة الآن':esc(dueLabel(m.next,today()))):'—')+'</span></div><div class="kv"><span>عدد المراجعات</span><span class="num">'+(m.reviews||0)+'</span></div><div class="btn-row" style="margin-top:8px"><button type="button" class="btn primary" data-action="review-ok" data-n="'+n+'">راجعتها اليوم ✓</button><button type="button" class="btn" data-action="review-fail" data-n="'+n+'">احتجت مساعدة ↺</button></div></div>':'')
    +'<p class="hint" id="f-err" style="color:var(--bad);font-weight:600" hidden></p><div class="form-actions"><button type="submit" class="btn primary">حفظ</button></div></form>'; openSheet(html,{title:'الحفظ',focus:false,ctx:{kind:'surah',id:n}}); }
function saveSurah(form){ const n=draft.n, st=draft.status; let ayahs=Math.round(parseAmount(form.ayahs.value)); const ay=SURAHS[n-1][1]; if(!isFinite(ayahs)||ayahs<0) ayahs=0; if(ayahs>ay) ayahs=ay; const prev=memoOf(n); commit('تم حفظ حالة السورة',()=>{ const memo=DN().quran.memo; if(st==='none'){ delete memo[String(n)]; return; } const m=memo[String(n)]||{status:'none',ayahs:0,level:0,reviews:0,last:null,next:null}; m.status=st; m.ayahs=st==='learning'?ayahs:ay; if(st==='done'&&(!prev||prev.status!=='done')){ m.last=today(); m.level=0; m.next=addDays(today(),REVIEW_INTERVALS[0]); } memo[String(n)]=m; }); if(st==='done'&&(!prev||prev.status!=='done')) showSysWindow({head:'[ الحفظ ]',title:'سورة '+esc(SURAHS[n-1][0])+' محفوظة',sub:'بارك الله فيك. <b>+'+(ay*2)+' نقطة</b> · أول مراجعة غدًا',ms:4500}); draft=null; if(sheetOpen) surahsSheet(); }
function reviewSurah(n,ok){ const m=memoOf(n); if(!m||m.status!=='done') return; const d=today(); commit(ok?'تمت المراجعة — المراجعة القادمة بعد '+nDays(REVIEW_INTERVALS[Math.min(REVIEW_INTERVALS.length-1,(m.level||0)+1)]):'أُعيدت السورة للمراجعة اليومية',()=>{ const x=DN().quran.memo[String(n)]; if(!x) return; if(ok){ x.level=Math.min(REVIEW_INTERVALS.length-1,(x.level||0)+1); x.reviews=(x.reviews||0)+1; } else { x.level=0; } x.last=d; x.next=addDays(d,REVIEW_INTERVALS[x.level]); }); if(sheetOpen) refreshSheet(); }

/* ===================== الجسد والتغذية — منطق ===================== */
const MUSCLES=[['chest','صدر'],['back','ظهر'],['legs','أرجل'],['shoulders','كتف'],['arms','ذراع'],['core','بطن'],['cardio','كارديو'],['full','جسم كامل']];
const MUSCLE_NAME={}; MUSCLES.forEach(m=>MUSCLE_NAME[m[0]]=m[1]);
const SLOTS=[['breakfast','فطور'],['lunch','غداء'],['dinner','عشاء'],['snack','سناك'],['pre','قبل التمرين'],['post','بعد التمرين']];
const SLOT_NAME={}; SLOTS.forEach(s=>SLOT_NAME[s[0]]=s[1]);
const MEASURES=[['waist','الخصر'],['chest','الصدر'],['arms','الذراع'],['thighs','الفخذ'],['hips','الأرداف'],['shoulders','الأكتاف'],['neck','الرقبة']];
const WEEK=[6,0,1,2,3,4,5];
function FT(){ return state.fit; }
function exById(id){ return FT().exercises.find(e=>e.id===id)||null; }
function emptyDay(){ return {workout:{name:'',items:[]},rest:false,meals:[]}; }
function dayPlan(wd){ return FT().plan[wd]||emptyDay(); }
function planFor(d){ return dayPlan(parseISO(d).getDay()); }
function fitLog(d){ return FT().logs[d]||{}; }
function ensureFitLog(d){ if(!FT().logs[d]) FT().logs[d]={}; return FT().logs[d]; }
function setsOf(d,exId){ const w=fitLog(d).workout; return (w&&w.sets&&w.sets[exId])||[]; }
function workoutProgress(d){ const p=planFor(d); let total=0,done=0; if(p.rest) return {total:0,done:0,complete:false,rest:true}; p.workout.items.forEach(it=>{ total+=it.sets; const s=setsOf(d,it.exId); for(let i=0;i<it.sets;i++){ if(s[i]&&s[i].done) done++; } }); return {total,done,complete:total>0&&done===total,rest:false}; }
function mealsProgress(d){ const p=planFor(d); const eaten=fitLog(d).meals||{}; let done=0; p.meals.forEach(m=>{ if(eaten[m.id]) done++; }); return {total:p.meals.length,done}; }
function nutritionToday(d){ const p=planFor(d); const eaten=fitLog(d).meals||{}; let kcal=0,protein=0; p.meals.forEach(m=>{ if(eaten[m.id]){ kcal+=(+m.kcal||0); protein+=(+m.protein||0); } }); (fitLog(d).extra||[]).forEach(x=>{ kcal+=(+x.kcal||0); protein+=(+x.protein||0); }); return {kcal,protein}; }
function planTotals(p){ let kcal=0,protein=0; (p.meals||[]).forEach(m=>{ kcal+=(+m.kcal||0); protein+=(+m.protein||0); }); return {kcal,protein}; }
function exHistory(exId){ const out=[]; Object.keys(FT().logs).sort().forEach(d=>{ const s=setsOf(d,exId).filter(x=>x&&x.done); if(!s.length) return; out.push({date:d,max:Math.max(...s.map(x=>+x.weight||0)),volume:s.reduce((a,x)=>a+(+x.reps||0)*(+x.weight||0),0),sets:s.length}); }); return out; }
function exBest(exId){ const h=exHistory(exId); return h.length?Math.max(...h.map(x=>x.max)):0; }
function fitXP(){ let x=0; for(const d in FT().logs){ const L=FT().logs[d]; if(L.workout&&L.workout.sets){ for(const k in L.workout.sets){ L.workout.sets[k].forEach(s=>{ if(s&&s.done) x+=1; }); } } if(L.meals){ x+=Object.keys(L.meals).filter(k=>L.meals[k]).length*2; } } return x; }
function latestMeasures(){ const arr=B().metrics.slice().sort((a,b)=>a.date<b.date?1:-1); const out={}; MEASURES.forEach(m=>{ const k=m[0]; const cur=arr.find(x=>x[k]!=null); if(!cur) return; const prev=arr.find(x=>x[k]!=null&&x.date<cur.date); out[k]={v:cur[k],date:cur.date,delta:prev?round2(cur[k]-prev[k]):null}; }); return out; }
function weightSeries(n){ return B().metrics.filter(m=>m.weight!=null).sort((a,b)=>a.date<b.date?-1:1).slice(-n); }
function setPill(d,it,i){ const s=setsOf(d,it.exId)[i]; const ex=exById(it.exId); const reps=s&&s.reps!=null?s.reps:it.reps; const w=s&&s.weight!=null?s.weight:it.weight; const bw=ex&&ex.unit==='bw'; return '<button type="button" class="setp'+(s&&s.done?' on':'')+'" data-action="fit-set" data-ex="'+it.exId+'" data-i="'+i+'" data-date="'+d+'"><b class="num">'+reps+'</b>'+(bw?'<small>عدّة</small>':'<small>× '+fmtNum(w)+' كجم</small>')+'</button>'; }

function renderFit(){
  const seg=filters.fitView||'train';
  let out='<div class="seg seg-top">'+[['train','تمرين'],['food','تغذية'],['body','قياسات']].map(x=>'<button type="button" data-action="fit-view" data-v="'+x[0]+'" class="'+(seg===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>';
  try{ out+= seg==='food'?renderNutrition():seg==='body'?renderFitBody():renderFitTrain(); }catch(e){ reportError(e); out+='<div class="card"><p class="hint">حدث خطأ في عرض هذا القسم.</p></div>'; }
  return out;
}

function toggleSet(d,exId,i){ const p=planFor(d); const it=p.workout.items.find(x=>x.exId===exId); if(!it) return; const before=workoutProgress(d).complete; const bestBefore=exBest(exId); commit(null,()=>{ const L=ensureFitLog(d); if(!L.workout) L.workout={sets:{}}; if(!L.workout.sets) L.workout.sets={}; const arr=L.workout.sets[exId]||(L.workout.sets[exId]=[]); while(arr.length<=i) arr.push(null); const cur=arr[i]; arr[i]=cur?{reps:cur.reps,weight:cur.weight,done:!cur.done}:{reps:it.reps,weight:it.weight,done:true}; }); vibrate(8); const wp=workoutProgress(d); const nowDone=!!((setsOf(d,exId)[i]||{}).done); if(nowDone&&d===today()){ checkPR(exId,bestBefore); if(!wp.complete) startRest(); else { restT=null; renderRest(); } } if(!before&&wp.complete) finishWorkout(d,true); }
function finishWorkout(d,auto){ const p=planFor(d); const L=ensureFitLog(d); if(L.workout&&L.workout.sessionId&&B().sessions.some(s=>s.id===L.workout.sessionId)){ if(!auto) toast('تمرين اليوم مسجّل بالفعل'); return; } const wp=workoutProgress(d); const minutes=Math.min(120,Math.max(15,wp.done*3)); commit(null,()=>{ const id=uid(); B().sessions.push({id,date:d,kind:'strength',minutes,intensity:2,skillId:null,hr:null,note:'من الجدول: '+(p.workout.name||'تمرين اليوم'),createdAt:nowISO()}); const LL=ensureFitLog(d); if(!LL.workout) LL.workout={sets:{}}; LL.workout.sessionId=id; LL.workout.completedAt=nowISO(); }); xpPop($('.wo .wo-h'),'+'+(10+Math.min(20,Math.floor(minutes/10)))); showSysWindow({head:'[ التمرين ]',title:(p.workout.name||'تمرين اليوم')+' مكتمل',sub:'<b>'+wp.done+'</b> مجموعة · سُجّلت جلسة قوة '+minutes+' دقيقة',ms:4000}); }
function toggleMeal(d,id){ const p=planFor(d); const m=p.meals.find(x=>x.id===id); if(!m) return; const before=mealsProgress(d); commit(null,()=>{ const L=ensureFitLog(d); if(!L.meals) L.meals={}; if(L.meals[id]) delete L.meals[id]; else L.meals[id]=true; }); vibrate(6); const mp=mealsProgress(d); if(mp.total&&mp.done===mp.total&&before.done<before.total) toast('التزمت بكل وجبات اليوم ✓ (+'+(mp.total*2)+')',{ms:2500}); }

function saveSets(form){ const d=draft.d, exId=draft.exId; const p=planFor(d); const it=p.workout.items.find(x=>x.exId===exId); const ex=exById(exId); if(!it||!ex) return closeSheet(); const before=workoutProgress(d).complete; const bestBefore=exBest(exId); const arr=[]; for(let i=0;i<it.sets;i++){ let reps=Math.round(parseAmount(form['reps'+i].value)); if(!(reps>0)) reps=it.reps; let w=ex.unit==='bw'?0:parseAmount(form['w'+i].value); if(!(w>=0)) w=it.weight; arr.push({reps,weight:round2(w),done:!!form['done'+i].checked}); } commit('تم حفظ المجموعات',()=>{ const L=ensureFitLog(d); if(!L.workout) L.workout={sets:{}}; if(!L.workout.sets) L.workout.sets={}; L.workout.sets[exId]=arr; }); closeSheet(); checkPR(exId,bestBefore); if(!before&&workoutProgress(d).complete) finishWorkout(d,true); }

function saveExercise(form){ const name=form.name.value.trim(); if(!name) return formErr('اكتب اسم التمرين.'); let sets=Math.round(parseAmount(form.sets.value)), reps=Math.round(parseAmount(form.reps.value)), w=parseAmount(form.weight.value); if(!(sets>0)) sets=3; if(!(reps>0)) reps=10; if(!(w>=0)) w=0; const isNew=!draft.id, muscle=draft.muscle, unit=draft.unit; let id=draft.id; const ret=draft.returnPlan; commit(isNew?'تمت إضافة التمرين':'تم حفظ التمرين',()=>{ if(isNew){ id=uid(); FT().exercises.push({id,name,muscle,unit,defSets:sets,defReps:reps,defWeight:round2(w),createdAt:nowISO(),archived:false}); } else { const e=exById(id); if(e) Object.assign(e,{name,muscle,unit,defSets:sets,defReps:reps,defWeight:round2(w)}); } }); draft=null; if(ret!=null){ const dp=clone(dayPlan(ret)); dp.workout.items.push({exId:id,sets,reps,weight:round2(w)}); FT().plan[ret]=dp; save(); planSheet(ret); } else if(isNew) closeSheet(); else exerciseDetail(id); }

/* ===================== سجل الأوزان والهدف ===================== */
function allWeights(){ return B().metrics.filter(m=>m.weight!=null).sort((a,b)=>a.date<b.date?-1:1); }
function bmiOf(w,h){ if(!w||!h) return null; const m=h/100; return round2(w/(m*m)); }
function bmiCat(b){ if(b==null) return ''; if(b<18.5) return 'نحافة'; if(b<25) return 'طبيعي'; if(b<30) return 'زيادة وزن'; return 'سمنة'; }
function weeklyRate(){ const ws=allWeights(); if(ws.length<2) return null; const last=ws[ws.length-1]; const from=addDays(last.date,-28); const base=ws.filter(w=>w.date<=from).pop()||ws[0]; const days=daysBetween(base.date,last.date); if(days<7) return null; return round2((last.weight-base.weight)/days*7); }
function weightStats(){ const ws=allWeights(); if(!ws.length) return null; const first=ws[0], last=ws[ws.length-1]; const d30=addDays(last.date,-30); const b30=ws.filter(w=>w.date<=d30).pop(); const h=FT().height||0, goal=FT().goalWeight||0; const rate=weeklyRate(); const bmi=bmiOf(last.weight,h); const waist=latestMeasures().waist; const whtr=(waist&&h)?round2(waist.v/h):null; let eta=null, weeksLeft=null; if(goal&&rate&&Math.abs(rate)>=0.05){ const remaining=goal-last.weight; if((remaining<0&&rate<0)||(remaining>0&&rate>0)){ weeksLeft=Math.ceil(Math.abs(remaining/rate)); eta=addDays(last.date,weeksLeft*7); } } return {first,last,total:round2(last.weight-first.weight),change30:b30?round2(last.weight-b30.weight):null,rate,bmi,whtr,goal,eta,weeksLeft,min:Math.min(...ws.map(w=>w.weight)),max:Math.max(...ws.map(w=>w.weight)),n:ws.length}; }
function weightChartSVG(ws){ if(ws.length<2) return ''; const W=320,H=120,P=14; const xs=ws.map(w=>daysBetween(ws[0].date,w.date)); const span=Math.max(1,xs[xs.length-1]); const mn=Math.min(...ws.map(w=>w.weight)), mx=Math.max(...ws.map(w=>w.weight)); const rng=Math.max(1,mx-mn); const X=i=>P+xs[i]/span*(W-2*P), Y=v=>H-P-(v-mn)/rng*(H-2*P); const pts=ws.map((w,i)=>X(i).toFixed(1)+','+Y(w.weight).toFixed(1)).join(' '); const avg=ws.map((w,i)=>{ const win=ws.filter((x,j)=>j<=i&&daysBetween(x.date,w.date)<=6); return X(i).toFixed(1)+','+Y(win.reduce((a,x)=>a+x.weight,0)/win.length).toFixed(1); }).join(' '); const goal=FT().goalWeight; const gy=(goal&&goal>=mn-rng*.3&&goal<=mx+rng*.3)?Y(goal):null; return '<svg class="wline" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--warn)" stop-opacity=".35"/><stop offset="1" stop-color="var(--warn)" stop-opacity="0"/></linearGradient></defs>'+(gy!=null?'<line x1="'+P+'" y1="'+gy.toFixed(1)+'" x2="'+(W-P)+'" y2="'+gy.toFixed(1)+'" stroke="var(--good)" stroke-dasharray="4 4" stroke-width="1.5"/>':'')+'<polygon points="'+X(0).toFixed(1)+','+(H-P)+' '+pts+' '+X(ws.length-1).toFixed(1)+','+(H-P)+'" fill="url(#wg)"/><polyline points="'+pts+'" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linejoin="round"/><polyline points="'+avg+'" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="2 3" opacity=".6"/>'+ws.map((w,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(w.weight).toFixed(1)+'" r="'+(i===ws.length-1?4:2.5)+'" fill="'+(i===ws.length-1?'var(--text)':'var(--warn)')+'"/>').join('')+'<text x="'+(W-P)+'" y="'+(Y(mx)-4).toFixed(1)+'" font-size="10" text-anchor="end" fill="var(--text-3)">'+fmtNum(mx)+'</text><text x="'+(W-P)+'" y="'+(Y(mn)+11).toFixed(1)+'" font-size="10" text-anchor="end" fill="var(--text-3)">'+fmtNum(mn)+'</text></svg>'; }
function weightLogSheet(){
  const ws=allWeights(), st=weightStats(); const d=today();
  let html='';

function weekRange(d){ const wd=parseISO(d).getDay(); const back=(wd-6+7)%7; const start=addDays(d,-back); return {start,end:addDays(start,6)}; }
function trainingWeek(d){ const r=weekRange(d); let planned=0,done=0,minutes=0,volume=0; for(let i=0;i<7;i++){ const x=addDays(r.start,i); if(x>d) break; const p=planFor(x); if(!p.rest&&p.workout.items.length){ planned++; const L=fitLog(x); if(L.workout&&(L.workout.completedAt||workoutProgress(x).complete)) done++; } } B().sessions.forEach(s=>{ if(s.date>=r.start&&s.date<=d&&BODY_K.includes(s.kind)) minutes+=s.minutes; }); for(const k in FT().logs){ if(k>=r.start&&k<=d){ const w=FT().logs[k].workout; if(w&&w.sets) for(const ex in w.sets) w.sets[ex].forEach(s=>{ if(s&&s.done) volume+=(+s.reps||0)*(+s.weight||0); }); } } return Object.assign(r,{planned,done,minutes,volume}); }

/* ===================== التغذية — منطق ===================== */
const MACROS=[['kcal','سعرة','var(--accent)'],['protein','بروتين','var(--good)'],['carbs','كارب','var(--warn)'],['fat','دهون','var(--bad)']];
function foodById(id){ return FT().foods.find(f=>f.id===id)||null; }
function foodUnitLabel(f){ return f.unit==='g'?'100 جم':(f.unitName||'وحدة'); }
function foodPer(f){ return {kcal:+f.kcal||0,protein:+f.protein||0,carbs:+f.carbs||0,fat:+f.fat||0}; }
function computeFood(f,qty){ const p=foodPer(f); const m=f.unit==='g'?qty/100:qty; return {kcal:Math.round(p.kcal*m),protein:round1(p.protein*m),carbs:round1(p.carbs*m),fat:round1(p.fat*m)}; }
function round1(n){ return Math.round((+n||0)*10)/10; }
function foodLog(d){ return (fitLog(d).food)||[]; }
function slotNow(){ const h=new Date().getHours(); if(h<11) return 'breakfast'; if(h<16) return 'lunch'; if(h<21) return 'dinner'; return 'snack'; }
function eatenTotals(d){
  const t={kcal:0,protein:0,carbs:0,fat:0};
  const p=planFor(d), ticked=fitLog(d).meals||{};
  p.meals.forEach(m=>{ if(ticked[m.id]){ t.kcal+=+m.kcal||0; t.protein+=+m.protein||0; t.carbs+=+m.carbs||0; t.fat+=+m.fat||0; } });
  foodLog(d).forEach(x=>{ t.kcal+=+x.kcal||0; t.protein+=+x.protein||0; t.carbs+=+x.carbs||0; t.fat+=+x.fat||0; });
  t.protein=round1(t.protein); t.carbs=round1(t.carbs); t.fat=round1(t.fat); t.kcal=Math.round(t.kcal);
  return t;
}
function targets(){ const t=FT().targets||{}; return {kcal:+t.kcal||0,protein:+t.protein||0,carbs:+t.carbs||0,fat:+t.fat||0}; }
function slotEntries(d,slot){ const p=planFor(d), ticked=fitLog(d).meals||{}; const planned=p.meals.filter(m=>m.slot===slot).map(m=>({type:'plan',m,eaten:!!ticked[m.id]})); const logged=foodLog(d).filter(x=>x.slot===slot).map(x=>({type:'log',x})); return planned.concat(logged); }
function recentFoods(n){ const seen={},out=[]; const days=Object.keys(FT().logs).sort().reverse(); for(const d of days){ for(const x of (FT().logs[d].food||[])){ if(x.foodId&&!seen[x.foodId]){ seen[x.foodId]=1; const f=foodById(x.foodId); if(f) out.push(f); if(out.length>=n) return out; } } } return out; }
function tdee(){ const p=FT().profile||{}; const ws=allWeights(); const w=ws.length?ws[ws.length-1].weight:0, h=FT().height||0, age=+p.age||0;
  if(!w||!h||!age) return null;
  const bmr=(p.sex==='f')?(10*w+6.25*h-5*age-161):(10*w+6.25*h-5*age+5);
  const act={low:1.2,light:1.375,mod:1.55,high:1.725}[p.activity||'light']||1.375;
  return {bmr:Math.round(bmr),tdee:Math.round(bmr*act),w:w};
}
function suggestTargets(goal){ const t=tdee(); if(!t) return null; const adj={cut:-400,keep:0,bulk:300}[goal||'keep']||0; const kcal=Math.max(1200,Math.round((t.tdee+adj)/10)*10); const protein=Math.round(t.w*(goal==='cut'?2:1.8)); const fat=Math.round(kcal*0.25/9); const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4)); return {kcal,protein,carbs,fat}; }

      return '<div class="slot-h"><span>'+esc(s[1])+'</span><span class="num">'+sum.kcal+' سعرة</span></div>'+ent.map(z=>{
        if(z.type==='plan') return '<div class="fitem'+(z.eaten?' on':'')+'"><button type="button" class="chk'+(z.eaten?' on':'')+'" data-action="fit-meal" data-id="'+z.m.id+'" data-date="'+d+'" aria-label="أكلت">'+ICON.check+'</button><div class="fi-b"><div class="fi-t">'+esc(z.m.title||'وجبة مخططة')+' <span class="chip">مخططة</span></div>'+(z.m.items&&z.m.items.length?'<div class="fi-s">'+z.m.items.map(esc).join(' · ')+'</div>':'')+'</div><div class="fi-n"><b class="num">'+(+z.m.kcal||0)+'</b><small class="num">'+fmtNum(+z.m.protein||0)+' بر</small></div></div>';

async function aiFetch(body){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':AI().key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});

}
function aiErrMsg(r){
  if(r.status===401) return 'المفتاح غير صحيح أو ملغي — راجعه في الإعدادات.';
  if(r.status===400) return 'الطلب مرفوض: '+((r.json&&r.json.error&&r.json.error.message)||'').slice(0,120);
  if(r.status===429) return 'وصلت حد الاستخدام المؤقت — استنى دقيقة وجرّب تاني.';
  if(r.status===402||(r.json&&r.json.error&&/credit|balance/i.test(r.json.error.message||''))) return 'الرصيد خلص — اشحن من console.anthropic.com.';
  if(r.status>=500) return 'خدمة Claude مش متاحة دلوقتي — جرّب بعد شوية.';
  return 'فشل الاتصال: '+(r.status||'لا يوجد إنترنت');
}
function extractJSON(s){ if(!s) return null; let t=String(s).trim(); const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f) t=f[1].trim(); const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a<0||b<a) return null; try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ return null; } }
async function aiParse(text){
  const model=AI().model||'claude-haiku-4-5';
  const base={model,max_tokens:2000,system:AI_SYS+'\n\n=== حالة التطبيق الآن ===\n'+aiContext(),messages:[{role:'user',content:text}]};
  let r=await aiFetch(Object.assign({},base,{output_config:{format:{type:'json_schema',schema:AI_SCHEMA}}}));
  if(!r.ok&&r.status===400) r=await aiFetch(Object.assign({},base,{system:base.system+'\n\nأخرج JSON فقط بالشكل: {"reply":"...","actions":[{"type":"...","label":"...", ...}]} بدون أي نص خارج الـ JSON.'}));
  if(!r.ok) throw new Error(aiErrMsg(r));
  const msg=r.json||{}; aiTrack(model,msg.usage);
  const txt=(msg.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
  const data=extractJSON(txt);
  if(!data) throw new Error('الرد وصل بشكل غير متوقع — جرّب تاني أو صِغ كلامك بشكل أوضح.');
  return {reply:String(data.reply||''),actions:Array.isArray(data.actions)?data.actions.filter(a=>a&&ACT_LABEL[a.type]):[]};
}

function monthsRange(max){ const act=activeMonths(); const cur=curMonth(); let first=act.length?act[0]:cur; if(first>cur) first=cur; const out=[]; let m=first, guard=0; while(m<=cur&&guard++<120){ out.push(m); m=addMonths(m,1); } return max?out.slice(-max):out; }
function bucketTimeline(b,months){ let run=0; return months.map(m=>{ const bm=bucketMonth(b,m); run=round2(run+bm.net); return {m,alloc:bm.alloc,spent:bm.spent,tin:bm.tin,tout:bm.tout,net:bm.net,run}; }); }
function netPosition(m){ m=m||curMonth(); let pos=0,neg=0; sortedBuckets().forEach(b=>{ const v=bucketState(b,m).balance; if(v>=0) pos+=v; else neg+=v; }); return {pos:round2(pos),neg:round2(neg),total:round2(pos+neg)}; }
function monthNet(m){ return round2(monthIncome(m)-monthSpent(m)); }
function catTotals(months){ const t={}; F().expenses.forEach(e=>{ if(months.indexOf(ym(e.date))<0) return; const k=e.category||'أخرى'; t[k]=round2((t[k]||0)+e.amount); }); return Object.entries(t).sort((a,b)=>b[1]-a[1]); }
function lineChart(vals,labels,color){
  if(vals.length<2) return '';
  const W=320,H=110,P=16; const mn=Math.min(0,...vals), mx=Math.max(0,...vals); const rng=Math.max(1,mx-mn);
  const X=i=>P+(vals.length===1?0:i/(vals.length-1))*(W-2*P), Y=v=>H-P-(v-mn)/rng*(H-2*P);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const zero=(mn<0&&mx>0)?'<line x1="'+P+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-P)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 3" stroke-width="1"/>':'';
  return '<svg class="wline" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+zero+'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"/>'+vals.map((v,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===vals.length-1?3.5:2)+'" fill="'+(v<0?'var(--bad)':color)+'"/>').join('')+'</svg>';
}

function debtTotals(){ let mine=0,theirs=0; debts().forEach(d=>{ const l=debtLeft(d); if(l<=0.009) return; if(d.kind==='owed_to_me') mine+=l; else theirs+=l; }); return {mine:round2(mine),theirs:round2(theirs),net:round2(mine-theirs)}; }

    if(todayH.length) out+='<div class="section">'+sectionH('مجدولة اليوم',todayH.length)+'<div class="list">'+todayH.map(h=>habitRow(h,d)).join('')+'</div></div>';

function afterSave(){ const rg=draft&&draft.returnGoal; if(rg&&goalById(rg)){ draft=null; goalDetail(rg); } else closeSheet(); }
function saveTask(form){
  const title=form.title.value.trim(); if(!title) return formErr('اكتب عنوان المهمة أولًا.');
  const rep=form.repeat.value; let due=form.due.value||null; const time=form.time.value||null;
  if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)) due=null;
  let repeat=null;
  if(rep!=='none'){ repeat={type:rep,days:rep==='weekly'?draft.days.slice().sort():[]}; if(rep==='weekly'&&!repeat.days.length) return formErr('اختر يومًا واحدًا على الأقل للتكرار الأسبوعي.'); if(!due) due=today(); }
  const goalId=form.goalId.value||null, note=form.note.value.trim(), isNew=!draft.id, subs=draft.subtasks, prio=draft.priority;
  commit(isNew?'تمت إضافة المهمة':'تم حفظ المهمة',()=>{

    else{ const t=state.tasks.find(x=>x.id===draft.id); if(!t) return; Object.assign(t,{title,note,goalId,priority:prio,due,time,repeat,subtasks:subs}); if(repeat) t.done=false; }
  });
  afterSave();
}
function saveHabit(form){

  const target=Math.max(1,Math.min(99,parseInt(form.target.value,10)||1)), unit=form.unit.value.trim(), goalId=form.goalId.value||null, isNew=!draft.id, type=draft.type, days=draft.days.slice().sort(), color=draft.color;
  commit(isNew?'تمت إضافة العادة':'تم حفظ العادة',()=>{
    if(isNew) state.habits.push({id:uid(),title,type,days,target,unit,color,goalId,log:{},createdAt:nowISO(),archived:false});
    else{ const h=state.habits.find(x=>x.id===draft.id); if(h) Object.assign(h,{title,type,days,target,unit,color,goalId}); }
  });

}
function saveGoal(form){

  const why=form.why.value.trim(); let deadline=form.deadline.value||null; if(deadline&&!/^\d{4}-\d{2}-\d{2}$/.test(deadline)) deadline=null;
  const isNew=!draft.id, area=draft.area, color=draft.color; let id=draft.id;

    T({title:'أشوف فيديو عن المذاكرة الفعّالة',priority:1,note:'ابحث عن: active recall / spaced repetition'})
  );
  const logFor=(days,target,pattern)=>{ const log={}; for(let i=1;i<=days;i++){ const x=addDays(d,-i); const v=pattern(i); if(v>0) log[x]=Math.min(v,target); } return log; };
  const H=(o)=>Object.assign({id:uid(),type:'build',days:[0,1,2,3,4,5,6],target:1,unit:'',color:COLORS[0],goalId:null,log:{},createdAt:ago(16),archived:false,sample:true},o);
  state.habits.push(
    H({title:'قراءة 20 صفحة',goalId:g1.id,color:COLORS[0],log:logFor(14,1,i=>(i===3?0:1))}),
    H({title:'شرب مياه',target:8,unit:'كوب',color:COLORS[6],log:Object.assign(logFor(14,8,i=>(i%4===0?5:8)),{[d]:3})}),
    H({title:'رياضة 30 دقيقة',days:[0,2,4],color:COLORS[2],log:logFor(14,1,i=>([0,2,4].includes(parseISO(addDays(d,-i)).getDay())&&i!==5?1:0))})
  );
  seedFinanceSamples(); seedBodySamples(); seedFitSamples();
}
